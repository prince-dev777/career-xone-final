<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1470 980" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040b17" />
      <stop offset="35%" stop-color="#091b36" />
      <stop offset="70%" stop-color="#0e2a56" />
      <stop offset="100%" stop-color="#040b17" />
    </linearGradient>

    <!-- Gold Foil Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1aa" />
      <stop offset="25%" stop-color="#fbbf24" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Cyan / Light Blue Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Action Button Gradient -->
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Radial Glow Behind Card -->
    <radialGradient id="cardGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="topBlueGlow" cx="30%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.75" />
    </filter>

    <filter id="btnShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#f59e0b" flood-opacity="0.45" />
    </filter>
  </defs>

  <style>
    .font-title { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-weight: 800; }
    .font-sans  { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
    .gold-text  { fill: url(#goldGrad); }
    .cyan-text  { fill: url(#cyanGrad); }
  </style>

  <!-- 1. Background Fill -->
  <rect width="1470" height="980" fill="url(#bgGrad)" />
  <rect width="1470" height="980" fill="url(#topBlueGlow)" />

  <!-- Subtle Blueprint Grid Lines -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1.2">
    <line x1="0" y1="120" x2="1470" y2="120" />
    <line x1="0" y1="240" x2="1470" y2="240" />
    <line x1="0" y1="360" x2="1470" y2="360" />
    <line x1="0" y1="480" x2="1470" y2="480" />
    <line x1="0" y1="600" x2="1470" y2="600" />
    <line x1="0" y1="720" x2="1470" y2="720" />
    <line x1="0" y1="840" x2="1470" y2="840" />
    <line x1="180" y1="0" x2="180" y2="980" />
    <line x1="360" y1="0" x2="360" y2="980" />
    <line x1="540" y1="0" x2="540" y2="980" />
    <line x1="720" y1="0" x2="720" y2="980" />
    <line x1="900" y1="0" x2="900" y2="980" />
    <line x1="1080" y1="0" x2="1080" y2="980" />
    <line x1="1260" y1="0" x2="1260" y2="980" />
  </g>

  <!-- Decorative Outer Border Frame -->
  <rect x="30" y="30" width="1410" height="920" rx="24" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
  <rect x="42" y="42" width="1386" height="896" rx="20" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.25" stroke-dasharray="16 10" />

  <!-- Background Ambient Glow Behind Card -->
  <circle cx="1160" cy="460" r="260" fill="url(#cardGlow)" />

  <!-- ============================================================== -->
  <!-- TOP BAR: PILL TAGS (SAFE MARGINS FROM X: 85) -->
  <!-- ============================================================== -->
  <!-- Academy Badge Pill -->
  <g transform="translate(85, 65)">
    <rect width="450" height="42" rx="21" fill="rgba(37,99,235,0.22)" stroke="rgba(56,189,248,0.45)" stroke-width="1.2" />
    <text x="24" y="27" fill="#38bdf8" class="font-sans" font-size="14.5" font-weight="700" letter-spacing="1">
      ★ VIDARBHA'S #1 JEE &amp; NEET COACHING ACADEMY
    </text>
  </g>

  <!-- Helpline Badge Pill (With BOTH contact numbers) -->
  <g transform="translate(870, 65)">
    <rect width="515" height="42" rx="21" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)" stroke-width="1.2" />
    <circle cx="24" cy="21" r="6" fill="#10b981" />
    <text x="42" y="27" fill="#ffffff" class="font-sans" font-size="14" font-weight="700" letter-spacing="0.5">
      HELPLINE: +91 96733 83561 / 91454 81323
    </text>
  </g>

  <!-- ============================================================== -->
  <!-- LEFT COLUMN: BRANDING & MAIN SCHOLARSHIP HEADLINE -->
  <!-- ============================================================== -->
  <!-- CX Logo Emblem -->
  <g transform="translate(85, 145)">
    <rect width="68" height="68" rx="16" fill="url(#cyanGrad)" />
    <text x="34" y="47" fill="#050e1d" class="font-title" font-size="30" font-weight="900" text-anchor="middle">CX</text>
    
    <text x="86" y="42" fill="#ffffff" class="font-title" font-size="36" font-weight="800" letter-spacing="-0.5">CAREER <tspan fill="#38bdf8">XONE</tspan></text>
    <text x="88" y="66" fill="#94a3b8" class="font-sans" font-size="14" font-weight="700" letter-spacing="2.5">GONDIA CAMPUS</text>
  </g>

  <!-- Main Exam Name -->
  <g transform="translate(85, 260)">
    <!-- Big Gold Title -->
    <text x="0" y="55" class="font-title gold-text" font-size="70" font-weight="950" letter-spacing="-1">
      CXSAT 2026-27
    </text>

    <!-- Subheadline -->
    <text x="0" y="105" fill="#ffffff" class="font-sans" font-size="24" font-weight="800" letter-spacing="2">
      CAREER XONE SCHOLARSHIP ADMISSION TEST
    </text>

    <!-- Description -->
    <text x="0" y="142" fill="#cbd5e1" class="font-sans" font-size="17" font-weight="500">
      Benchmark your potential &amp; earn prestigious merit scholarships with expert guidance
    </text>

    <!-- Target Audience Pill -->
    <g transform="translate(0, 160)">
      <rect width="490" height="34" rx="8" fill="rgba(56,189,248,0.12)" stroke="rgba(56,189,248,0.3)" stroke-width="1" />
      <text x="16" y="23" fill="#38bdf8" class="font-sans" font-size="14" font-weight="700">
        🎓 For Students of Class 7th, 8th, 9th, 10th, 11th, 12th &amp; Droppers
      </text>
    </g>
  </g>

  <!-- Course Stream Tags -->
  <g transform="translate(85, 490)">
    <g transform="translate(0, 0)">
      <rect width="160" height="40" rx="10" fill="#172554" stroke="#2563eb" stroke-width="1.2" />
      <text x="80" y="25" fill="#93c5fd" class="font-sans" font-size="14" font-weight="700" text-anchor="middle">IIT-JEE (Main+Adv)</text>
    </g>
    <g transform="translate(175, 0)">
      <rect width="150" height="40" rx="10" fill="#172554" stroke="#2563eb" stroke-width="1.2" />
      <text x="75" y="25" fill="#93c5fd" class="font-sans" font-size="14" font-weight="700" text-anchor="middle">NEET (Medical)</text>
    </g>
    <g transform="translate(340, 0)">
      <rect width="165" height="40" rx="10" fill="#172554" stroke="#2563eb" stroke-width="1.2" />
      <text x="82" y="25" fill="#93c5fd" class="font-sans" font-size="14" font-weight="700" text-anchor="middle">MHT-CET / Boards</text>
    </g>
    <g transform="translate(520, 0)">
      <rect width="180" height="40" rx="10" fill="#172554" stroke="#2563eb" stroke-width="1.2" />
      <text x="90" y="25" fill="#93c5fd" class="font-sans" font-size="14" font-weight="700" text-anchor="middle">Foundation (6 to 10)</text>
    </g>
  </g>

  <!-- 3 Feature Highlight Badges -->
  <g transform="translate(85, 565)">
    <!-- Feature 1 -->
    <g transform="translate(0, 0)">
      <rect width="215" height="66" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <circle cx="35" cy="33" r="18" fill="rgba(37,99,235,0.25)" />
      <text x="35" y="39" fill="#60a5fa" font-size="16" text-anchor="middle">📅</text>
      <text x="65" y="28" fill="#ffffff" class="font-sans" font-size="14.5" font-weight="800">Every Sunday</text>
      <text x="65" y="48" fill="#94a3b8" class="font-sans" font-size="12">Offline &amp; Online Mode</text>
    </g>

    <!-- Feature 2 -->
    <g transform="translate(235, 0)">
      <rect width="225" height="66" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <circle cx="35" cy="33" r="18" fill="rgba(16,185,129,0.25)" />
      <text x="35" y="39" fill="#34d399" font-size="16" text-anchor="middle">⚡</text>
      <text x="65" y="28" fill="#ffffff" class="font-sans" font-size="14.5" font-weight="800">₹0 Registration Fee</text>
      <text x="65" y="48" fill="#94a3b8" class="font-sans" font-size="12">100% Free for all students</text>
    </g>

    <!-- Feature 3 -->
    <g transform="translate(480, 0)">
      <rect width="225" height="66" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <circle cx="35" cy="33" r="18" fill="rgba(245,158,11,0.25)" />
      <text x="35" y="39" fill="#fbbf24" font-size="16" text-anchor="middle">📊</text>
      <text x="65" y="28" fill="#ffffff" class="font-sans" font-size="14.5" font-weight="800">Rank &amp; Analysis</text>
      <text x="65" y="48" fill="#94a3b8" class="font-sans" font-size="12">Micro Performance Report</text>
    </g>
  </g>

  <!-- Big Call to Action Button & Venue -->
  <g transform="translate(85, 665)">
    <!-- Primary Button -->
    <g filter="url(#btnShadow)">
      <rect width="360" height="64" rx="14" fill="url(#btnGrad)" />
      <text x="180" y="40" fill="#000000" class="font-title" font-size="18" font-weight="900" text-anchor="middle" letter-spacing="0.5">
        👉 REGISTER ONLINE NOW
      </text>
    </g>

    <!-- Venue & Info Details -->
    <g transform="translate(390, 10)">
      <text x="0" y="22" fill="#ffffff" class="font-sans" font-size="15" font-weight="700">
        📍 Test Venue: Career Xone Gondia Campus
      </text>
      <text x="0" y="44" fill="#94a3b8" class="font-sans" font-size="13.5">
        Hadditoli Road, Near Ananya Hospital, Gondia | Website: www.cxjeeneet.com
      </text>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- RIGHT COLUMN: MASSIVE 100% SCHOLARSHIP CARD (CLEAR OF DOTS) -->
  <!-- ============================================================== -->
  <g transform="translate(930, 140)" filter="url(#cardShadow)">
    <!-- Container Card (Glassmorphism + Gold Border) -->
    <rect width="455" height="585" rx="28" fill="#071731" stroke="url(#goldGrad)" stroke-width="2.5" />
    
    <!-- Inner Accent Top Bar -->
    <g transform="translate(50, 32)">
      <rect width="355" height="38" rx="19" fill="url(#goldGrad)" />
      <text x="177" y="25" fill="#000000" class="font-title" font-size="13.5" font-weight="900" text-anchor="middle" letter-spacing="1.2">
        ★ MERIT REWARD PROGRAM ★
      </text>
    </g>

    <!-- "UPTO" text -->
    <text x="227" y="145" fill="#ffffff" class="font-title" font-size="34" font-weight="800" text-anchor="middle" letter-spacing="3">
      UPTO
    </text>

    <!-- Mega 100% -->
    <text x="227" y="275" class="font-title gold-text" font-size="124" font-weight="950" text-anchor="middle" letter-spacing="-4">
      100%
    </text>

    <!-- "SCHOLARSHIP" Banner -->
    <text x="227" y="325" fill="#ffffff" class="font-title" font-size="28" font-weight="800" text-anchor="middle" letter-spacing="3">
      SCHOLARSHIP
    </text>

    <!-- Fund Pool -->
    <text x="227" y="360" fill="#38bdf8" class="font-sans" font-size="16" font-weight="700" text-anchor="middle">
      Worth ₹50,00,000+ Total Fund Pool
    </text>

    <!-- Separator Line -->
    <line x1="45" y1="395" x2="410" y2="395" stroke="rgba(255,255,255,0.15)" stroke-width="1" />

    <!-- Card Benefits List -->
    <g transform="translate(50, 425)">
      <g transform="translate(0, 0)">
        <circle cx="12" cy="12" r="10" fill="rgba(16,185,129,0.2)" />
        <text x="12" y="16" fill="#34d399" font-size="12" font-weight="900" text-anchor="middle">✓</text>
        <text x="32" y="17" fill="#f8fafc" class="font-sans" font-size="15" font-weight="600">Up to 100% Tuition Fee Waiver</text>
      </g>
      <g transform="translate(0, 40)">
        <circle cx="12" cy="12" r="10" fill="rgba(16,185,129,0.2)" />
        <text x="12" y="16" fill="#34d399" font-size="12" font-weight="900" text-anchor="middle">✓</text>
        <text x="32" y="17" fill="#f8fafc" class="font-sans" font-size="15" font-weight="600">Free Books, Study Kits &amp; DPPs</text>
      </g>
      <g transform="translate(0, 80)">
        <circle cx="12" cy="12" r="10" fill="rgba(16,185,129,0.2)" />
        <text x="12" y="16" fill="#34d399" font-size="12" font-weight="900" text-anchor="middle">✓</text>
        <text x="32" y="17" fill="#f8fafc" class="font-sans" font-size="15" font-weight="600">Direct Mentorship by IITian Faculties</text>
      </g>
      <g transform="translate(0, 120)">
        <circle cx="12" cy="12" r="10" fill="rgba(16,185,129,0.2)" />
        <text x="12" y="16" fill="#34d399" font-size="12" font-weight="900" text-anchor="middle">✓</text>
        <text x="32" y="17" fill="#f8fafc" class="font-sans" font-size="15" font-weight="600">Special Super-30 Batch Admission</text>
      </g>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- BOTTOM SAFE ZONE (Y: 760 TO 980) -->
  <!-- Keeps the bottom 180px completely clean so dot indicators never overlap -->
  <!-- ============================================================== -->
  <g transform="translate(85, 770)">
    <text x="0" y="20" fill="rgba(255,255,255,0.4)" class="font-sans" font-size="13">
      * Scholarships awarded strictly based on score in CXSAT aptitude &amp; subject test. T&amp;C Apply.
    </text>
  </g>
</svg>
