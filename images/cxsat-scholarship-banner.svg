<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050e1d" />
      <stop offset="45%" stop-color="#0a1d3b" />
      <stop offset="100%" stop-color="#030914" />
    </linearGradient>

    <!-- Gold Foil Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe57f" />
      <stop offset="25%" stop-color="#fbbf24" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Cyan Glow Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Button Gradient -->
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="topGlow" cx="50%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="badgeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6" />
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-title { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; font-weight: 800; }
    .font-sans  { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
    .gold-text  { fill: url(#goldGrad); }
    .cyan-text  { fill: url(#cyanGrad); }
  </style>

  <!-- 1. Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#topGlow)" />

  <!-- Geometric Grid Pattern Overlay -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="150" y1="0" x2="150" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="450" y1="0" x2="450" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="750" y1="0" x2="750" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1050" y1="0" x2="1050" y2="630" />
  </g>

  <!-- Subtle Corner Borders -->
  <rect x="25" y="25" width="1150" height="580" rx="20" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
  <rect x="35" y="35" width="1130" height="560" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.3" stroke-dasharray="16 8" />

  <!-- Floating Glow Spheres -->
  <circle cx="1060" cy="140" r="140" fill="url(#badgeGlow)" />
  <circle cx="140" cy="500" r="160" fill="#2563eb" opacity="0.12" />

  <!-- ============================================================== -->
  <!-- HEADER / BRANDING -->
  <!-- ============================================================== -->
  <!-- Institute Pill Tag -->
  <g transform="translate(60, 50)">
    <rect width="420" height="38" rx="19" fill="rgba(37,99,235,0.18)" stroke="rgba(56,189,248,0.4)" stroke-width="1" />
    <text x="25" y="24" fill="#38bdf8" class="font-sans" font-size="13" font-weight="700" letter-spacing="1">
      ★ VIDARBHA'S #1 JEE &amp; NEET COACHING ACADEMY
    </text>
  </g>

  <!-- Top Right Helpline -->
  <g transform="translate(820, 50)">
    <rect width="320" height="38" rx="19" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <circle cx="24" cy="19" r="6" fill="#10b981" />
    <text x="42" y="24" fill="#f8fafc" class="font-sans" font-size="13" font-weight="700" letter-spacing="0.5">
      HELPLINE: +91 96733 83561
    </text>
  </g>

  <!-- ============================================================== -->
  <!-- MAIN TITLE & LOGO AREA -->
  <!-- ============================================================== -->
  <!-- Logo Emblem -->
  <g transform="translate(60, 115)">
    <rect width="64" height="64" rx="16" fill="url(#cyanGrad)" />
    <text x="32" y="44" fill="#050e1d" class="font-title" font-size="28" font-weight="900" text-anchor="middle">CX</text>
    
    <text x="82" y="38" fill="#ffffff" class="font-title" font-size="32" font-weight="800" letter-spacing="-0.5">CAREER <tspan fill="#38bdf8">XONE</tspan></text>
    <text x="84" y="60" fill="#94a3b8" class="font-sans" font-size="13" font-weight="600" letter-spacing="2">GONDIA CAMPUS</text>
  </g>

  <!-- TEST NAME -->
  <g transform="translate(60, 220)">
    <text x="0" y="35" class="font-title gold-text" font-size="52" font-weight="900" letter-spacing="-1">
      CXSAT 2026-27
    </text>
    <text x="0" y="70" fill="#ffffff" class="font-sans" font-size="22" font-weight="700" letter-spacing="2">
      CAREER XONE SCHOLARSHIP ADMISSION TEST
    </text>
    <text x="0" y="102" fill="#94a3b8" class="font-sans" font-size="16" font-weight="500">
      Benchmark your potential &amp; earn prestigious merit scholarships for Class 7th to 12th &amp; Droppers
    </text>
  </g>

  <!-- ============================================================== -->
  <!-- HUGE SCHOLARSHIP BADGE (RIGHT SIDE) -->
  <!-- ============================================================== -->
  <g transform="translate(740, 125)" filter="url(#shadow)">
    <!-- Badge Container with Glassmorphism -->
    <rect width="400" height="340" rx="24" fill="rgba(15, 23, 42, 0.75)" stroke="url(#goldGrad)" stroke-width="2" />
    
    <!-- Top Pill inside Badge -->
    <rect x="50" y="24" width="300" height="32" rx="16" fill="url(#goldGrad)" />
    <text x="200" y="45" fill="#000000" class="font-title" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="1">
      ★ MERIT REWARD PROGRAM ★
    </text>

    <!-- Percentage Highlight -->
    <text x="200" y="140" fill="#ffffff" class="font-title" font-size="34" font-weight="800" text-anchor="middle">UPTO</text>
    <text x="200" y="235" class="font-title gold-text" font-size="94" font-weight="950" text-anchor="middle" letter-spacing="-3">
      100%
    </text>
    <text x="200" y="275" fill="#f8fafc" class="font-title" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="2">
      SCHOLARSHIP
    </text>
    <text x="200" y="308" fill="#38bdf8" class="font-sans" font-size="14" font-weight="600" text-anchor="middle">
      Worth ₹50,00,000+ Total Fund Pool
    </text>
  </g>

  <!-- ============================================================== -->
  <!-- COURSES / TARGET PILL STRIP -->
  <!-- ============================================================== -->
  <g transform="translate(60, 360)">
    <!-- Pills Container -->
    <g transform="translate(0, 0)">
      <rect width="135" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="67" y="23" fill="#38bdf8" class="font-sans" font-size="13" font-weight="700" text-anchor="middle">IIT-JEE (Adv)</text>
    </g>
    <g transform="translate(145, 0)">
      <rect width="135" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="67" y="23" fill="#38bdf8" class="font-sans" font-size="13" font-weight="700" text-anchor="middle">NEET (Medical)</text>
    </g>
    <g transform="translate(290, 0)">
      <rect width="145" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="72" y="23" fill="#38bdf8" class="font-sans" font-size="13" font-weight="700" text-anchor="middle">MHT-CET / Boards</text>
    </g>
    <g transform="translate(445, 0)">
      <rect width="165" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="82" y="23" fill="#38bdf8" class="font-sans" font-size="13" font-weight="700" text-anchor="middle">Foundation (6 to 10)</text>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- TEST HIGHLIGHT ICONS (4 BADGES) -->
  <!-- ============================================================== -->
  <g transform="translate(60, 425)">
    <!-- Feature 1: Every Sunday -->
    <g transform="translate(0, 0)">
      <circle cx="20" cy="20" r="18" fill="rgba(37,99,235,0.2)" stroke="#2563eb" stroke-width="1" />
      <text x="20" y="25" fill="#60a5fa" font-size="15" text-anchor="middle">📅</text>
      <text x="48" y="18" fill="#ffffff" class="font-sans" font-size="14" font-weight="700">Every Sunday</text>
      <text x="48" y="34" fill="#94a3b8" class="font-sans" font-size="12">Offline &amp; Online Mode</text>
    </g>

    <!-- Feature 2: Free Registration -->
    <g transform="translate(195, 0)">
      <circle cx="20" cy="20" r="18" fill="rgba(16,185,129,0.2)" stroke="#10b981" stroke-width="1" />
      <text x="20" y="25" fill="#34d399" font-size="15" text-anchor="middle">⚡</text>
      <text x="48" y="18" fill="#ffffff" class="font-sans" font-size="14" font-weight="700">₹0 Registration Fee</text>
      <text x="48" y="34" fill="#94a3b8" class="font-sans" font-size="12">100% Free for all students</text>
    </g>

    <!-- Feature 3: Detailed Analysis -->
    <g transform="translate(400, 0)">
      <circle cx="20" cy="20" r="18" fill="rgba(245,158,11,0.2)" stroke="#f59e0b" stroke-width="1" />
      <text x="20" y="25" fill="#fbbf24" font-size="15" text-anchor="middle">📊</text>
      <text x="48" y="18" fill="#ffffff" class="font-sans" font-size="14" font-weight="700">Performance Report</text>
      <text x="48" y="34" fill="#94a3b8" class="font-sans" font-size="12">Micro Analysis + Career Advice</text>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- FOOTER BAR: CALL TO ACTION + VENUE -->
  <!-- ============================================================== -->
  <g transform="translate(60, 505)">
    <!-- Big CTA Button -->
    <g filter="url(#shadow)">
      <rect width="360" height="58" rx="12" fill="url(#btnGrad)" />
      <text x="180" y="36" fill="#000000" class="font-title" font-size="17" font-weight="900" text-anchor="middle" letter-spacing="0.5">
        👉 REGISTER ONLINE NOW
      </text>
    </g>

    <!-- Center & Address Details -->
    <g transform="translate(390, 8)">
      <text x="0" y="20" fill="#f8fafc" class="font-sans" font-size="14" font-weight="700">
        📍 Test Venue: Career Xone Gondia Campus
      </text>
      <text x="0" y="38" fill="#94a3b8" class="font-sans" font-size="13">
        Hadditoli Road, Near Ananya Hospital, Gondia (MH) 441601 | Website: www.cxjeeneet.com
      </text>
    </g>
  </g>
</svg>
